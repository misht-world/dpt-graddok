# ---------------------------------------------------------------------------
# ОБРАЗЕЦ НАСТРОЕК.
#
# Скопируйте этот файл рядом под именем config.yaml и впишите свои пароли.
# Сам config.yaml в репозиторий не попадает — в нём секреты.
# ---------------------------------------------------------------------------

# Папки, из которых собираются проекты.
#
# Обычно это не нужно заполнять: папки добавляются мышью в панели управления
# (http://localhost:8080/admin). Здесь они задаются только для первого запуска
# — при старте с пустым индексом список переносится в панель.
#
# Папкой может быть как контейнер с проектами внутри, так и сам проект:
#   sources:
#     - "D:/Проекты"                 # внутри лежат папки проектов
#     - "E:/Работа/ДПТ - Далта"      # это сам проект
sources: []

server:
  host: "127.0.0.1"   # 127.0.0.1 — наружу только через туннель.
                      # 0.0.0.0 — доступ и по локальной сети.
  port: 8080

auth:
  # Пароль для внешних пользователей (просмотр и скачивание).
  viewer_password: "smena-parol"
  # Пароль администратора (кнопка «Актуализировать», журнал публикаций).
  admin_password: "smena-parol-admin"
  # Срок жизни сессии, часов.
  session_hours: 72
  # Максимум неудачных попыток входа с одного IP за 15 минут.
  max_login_attempts: 10

# Где хранится индекс (SQLite) и служебные файлы.
data_dir: "./data"

scan:
  # Расширения, которые попадают в индекс.
  extensions: [".pdf"]

  # Группы документов. Каждая описывает путь от папки проекта: список
  # регулярных выражений, по одному на уровень вложенности.
  #
  #   path     — цепочка папок от корня проекта
  #   files    — брать только файлы с таким именем (если не задано — все)
  #   exclude  — не заходить в папки с такими именами на любом уровне
  #   matrix   — участвует ли группа в сводной матрице
  #   enabled  — включена ли группа
  groups:
    - id: iogv
      title: "Согласования ИОГВ"
      path:
        - '^08\s*[_.\-]?\s*Согласован'
        - '^02\s*[_.\-]?\s*Согласован.*ИОГВ'
      exclude: ['архив']
      matrix: true
      enabled: true

    - id: vypusk
      title: "Выпуск — заявления"
      path:
        - '^09\s*[_.\-]?\s*Выпуск'
      files: '^\s*Заявлени'
      exclude: ['архив']
      matrix: false
      enabled: true

    - id: order
      title: "Распоряжение КГА"
      path:
        - '^02\s*[_.\-]?\s*Исходн'
        - '^01\s*[_.\-]?\s*КГА'
      exclude: ['архив']
      decision: order
      org: КГА
      number: '\d{1,2}-\d{1,2}(?:-\d+)+(?:_\d{2})?'
      matrix: false
      enabled: true

    # --- Заготовки на будущее, включаются флагом enabled ---
    - id: owners
      title: "Собственники ЗУ"
      path:
        - '^08\s*[_.\-]?\s*Согласован'
        - '^01\s*[_.\-]?\s*Собственник'
      matrix: false
      enabled: false

    - id: developer
      title: "Согласования разработчика"
      path:
        - '^08\s*[_.\-]?\s*Согласован'
        - '^03\s*[_.\-]?\s*Согласован'
      matrix: false
      enabled: false

    - id: adjacent
      title: "Согласование смежных проектов"
      path:
        - '^08\s*[_.\-]?\s*Согласован'
        - '^04\s*[_.\-]?\s*Согласован'
      matrix: false
      enabled: false

# Сообщения в Телеграм после «Актуализировать». Токен бота и чаты — только в config.yaml
# на сервере, не в git. link — адрес ГРАДДОКа, он ставится в конце сообщения.
telegram:
  enabled: false
  bot_token: ""
  chat_ids: []
  link: ""

# Типы проектов. Папка проекта разбирается как "<ТИП> - <Наименование>".
project_types:
  - code: ДПТ
    title: "Документация по планировке территории"
    stages: true      # есть деление на 1 / 2 этап
  - code: ППТЛ
    title: "Проект планировки территории линейного объекта"
    stages: false

# Классификация документа по имени файла. Порядок важен:
# побеждает первое совпадение сверху вниз.
decisions:
  - id: approval
    label: "Согласование"
    kind: positive
    patterns:
      - 'согласовани[ея]'
      - 'согласовано'
      - 'положительн\w*\s+заключени\w*'
  - id: refusal
    label: "Отказ"
    kind: negative
    patterns:
      - 'отказ\w*'
      - 'отрицательн\w*'
  - id: remarks
    label: "Замечания"
    kind: neutral
    patterns:
      - 'замечани\w*'
  - id: application
    label: "Заявление"
    kind: info
    patterns:
      - 'заявлени\w*'
  - id: order
    label: "Распоряжение"
    kind: info
    patterns:
      - 'распоряжени\w*'
