<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Просмотр — ГРАДДОК</title>
<link rel="icon" href="/static/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
<style>
  :root { --fg: #111; --mut: #6b6b6b; --line: #e3e3e3; --acc: #ff4f12; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font-family: Manrope, system-ui, sans-serif; color: var(--fg); background: #f4f4f4; }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 8px 14px;
           background: #fff; border-bottom: 1px solid var(--fg); }
  header b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .sub { color: var(--mut); font-size: 12px; white-space: nowrap; }
  a.btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border: 1px solid var(--fg);
          border-radius: 4px; color: var(--fg); text-decoration: none; font-size: 13px; background: #fff; white-space: nowrap; }
  a.btn:hover { background: var(--fg); color: #fff; }
  #msg { padding: 40px 16px; text-align: center; color: var(--mut); }
  /* Word */
  #doc { padding: 16px 0; overflow-x: auto; }
  #doc .docx-wrapper { background: transparent; padding: 0; }
  #doc .docx-wrapper > section.docx { box-shadow: 0 1px 4px rgba(0,0,0,.15); margin: 0 auto 16px; }
  /* Excel */
  .tabs { position: sticky; top: 47px; z-index: 4; display: flex; gap: 0; overflow-x: auto; background: #fff; border-bottom: 1px solid var(--line); }
  .tabs button { border: none; border-right: 1px solid var(--line); background: #fff; padding: 8px 14px; font: inherit; font-size: 13px;
                 cursor: pointer; white-space: nowrap; color: var(--mut); }
  .tabs button[aria-selected="true"] { color: var(--fg); font-weight: 700; box-shadow: inset 0 -3px 0 var(--acc); }
  #sheet { overflow: auto; background: #fff; }
  #sheet table { border-collapse: collapse; font-size: 12.5px; }
  #sheet td { border: 1px solid var(--line); padding: 3px 6px; white-space: pre-wrap; vertical-align: top; max-width: 420px; }
  #sheet tr:first-child td { background: #fafafa; font-weight: 600; }
  .note { padding: 8px 14px; color: var(--mut); font-size: 12px; background: #fff8e6; border-bottom: 1px solid var(--line); }
</style>
</head>
<body>
<header>
  <span class="mdi mdi-file-eye-outline"></span>
  <b id="name">Документ</b>
  <span class="sub" id="kind"></span>
  <a class="btn" id="dl" href="#"><span class="mdi mdi-download"></span>Скачать</a>
</header>
<div id="msg">Загружаю…</div>
<div id="out"></div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx-preview@0.3.3/dist/docx-preview.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="/static/viewer.js"></script>
</body>
</html>
