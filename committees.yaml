# Справочник согласующих организаций.
#
# code    — основное сокращение (показывается в таблице)
# name    — полное наименование
# aliases — иные написания, встречающиеся в именах файлов
# active  — true: комитет в работе; false: учитываем, но в фильтрах по умолчанию скрыт
#           (если такой файл появится — он всё равно будет распознан корректно)
# parent  — для подведомственных организаций
#
# Суффикс " СПб" / "СПб" после сокращения распознаётся автоматически,
# отдельно прописывать его не нужно.
#
# ПОРЯДОК ЗАПИСЕЙ = ПОРЯДОК СТОЛБЦОВ в сводной матрице. Чтобы передвинуть
# комитет, перенесите его блок выше или ниже. Завершающий орган (final: true)
# всегда показывается последним, где бы он ни стоял в файле.

committees:
  - code: КБ
    name: Комитет по благоустройству Санкт-Петербурга
    active: true

  - code: КВЗПБ
    name: Комитет по вопросам законности, правопорядка и безопасности
    active: true

  - code: КЗ
    name: Комитет по здравоохранению
    active: true

  - code: КО
    name: Комитет по образованию
    active: false

  - code: КПООС
    name: Комитет по природопользованию, охране окружающей среды и обеспечению экологической безопасности
    active: true

  - code: КППИТ
    name: Комитет по промышленной политике, инновациям и торговле Санкт-Петербурга
    aliases: [КППИ]
    active: true

  - code: КРТИ
    name: Комитет по развитию транспортной инфраструктуры Санкт-Петербурга
    active: true

  - code: КСП
    name: Комитет по социальной политике Санкт-Петербурга
    active: true

  - code: КТ
    name: Комитет по транспорту
    active: true

  - code: КФКиС
    name: Комитет по физической культуре и спорту
    aliases: [КФИС, КФКИС, КФкиС]
    active: true

  - code: КЭИО
    name: Комитет по энергетике и инженерному обеспечению
    aliases: [КЭиИО]
    active: true

  - code: КЭПиСП
    name: Комитет по экономической политике и стратегическому планированию Санкт-Петербурга
    aliases: [КЭП, КЭПСП]
    active: false

  - code: КТур
    name: Комитет по туризму
    active: true

  - code: КС
    name: Комитет по строительству
    active: true

  - code: КГИОП
    name: Комитет по государственному контролю, использованию и охране памятников истории и культуры
    active: true

  # Районная администрация. Название района, если указано в имени файла
  # (напр. "РА Пушкинский", "Администрация Пушкинского района"),
  # попадает в колонку «Уточнение».
  - code: РА
    name: Районная администрация
    aliases: [Администрация, Райадминистрация]
    district: true
    active: true

  # Подведомственная КРТИ организация, встречается в примерах.
  - code: ЦТП
    name: СПб ГКУ «Центр транспортного планирования Санкт-Петербурга»
    parent: КРТИ
    active: true

  - code: КИО
    name: Комитет имущественных отношений Санкт-Петербурга
    active: true

  # Встречается в примерах (ДПТ - Далта / 1 этап / КГА), в исходном списке не было.
  # final: true — согласование этого органа считается завершающим. В сводной
  # матрице такой проект уходит вниз и показывается приглушённо. Отказ на это
  # не влияет. Пометку можно перенести на другой орган или убрать.
  - code: КГА
    name: Комитет по градостроительству и архитектуре
    final: true
    active: true

  # --- Учитываем, но пока не используем ---
  - code: КИС
    name: Комитет по информатизации и связи
    active: false

  - code: КК
    name: Комитет по культуре Санкт-Петербурга
    active: false

  - code: КМПиВОО
    name: Комитет по молодежной политике и взаимодействию с общественными организациями
    aliases: [КМПВОО]
    active: false

  - code: КНВШ
    name: Комитет по науке и высшей школе
    active: false

  # Заказчик — не комитет: нужен только проектам, где отмечен; срока ответа нет.
  - code: "Заказчик"
    name: "Заказчик"
    aliases: ["заказчика", "заказчику"]
    active: false
    custom: true
